<h1>{{ portalName }}</h1>
<p>Track your courses, monitor your progress, and manage your academic journey all in one place.</p>

<div class="stats">
  <span>Courses Available: {{ coursesCount }}</span>
  <span>Enrolled: 3</span>
  <span>GPA: 3.8</span>
</div>

<!-- Property binding: component → DOM, one-way -->
<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p>{{ message }}</p>

<!-- Two-way binding: DOM ↔ component -->
<input [(ngModel)]="searchTerm" placeholder="Search courses...">
<p>Searching for: {{ searchTerm }}</p>

<app-course-summary-widget></app-course-summary-widget>
<app-notification></app-notification>
